name: Build Sparking Zero Test APK
on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install system build tools
        run: sudo apt-get update && sudo apt-get install -y zsh ninja-build cmake

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.114'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install Android SDK 36 & NDK 28
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> $GITHUB_ENV

      - name: Build on-device packer stage
        run: |
          zsh android/ondevice/build.sh "$RUNNER_TEMP/ondevice-work" all

      - name: Build dev.nxnative.android.spark APK
        run: |
          cd android/app
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew apk \
            -PnxPackStage="$RUNNER_TEMP/ondevice-work/stage" \
            -PnxApp=spark \
            -PnxLabel="Peanuts Spark" \
            -PnxGames=010035F022078000

      - uses: actions/upload-artifact@v4
        with:
          name: peanuts-spark-apk
          path: android/app/out/nxnative-android-spark.apk
          
